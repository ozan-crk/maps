services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: harita_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://user:userpassword@db:3306/harita
    depends_on:
      - db
    command: node server.js

  db:
    image: mysql:8.0
    container_name: harita_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: harita
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
