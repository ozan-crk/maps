services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: harita_app
    restart: always
    ports:
      - "3010:3000"
    environment:
      - DATABASE_URL=mysql://${DB_USER:-user}:${DB_PASSWORD:-userpassword}@db:3306/${DB_NAME:-harita}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/public/uploads

  db:
    image: mysql:8.0
    container_name: harita_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-harita}
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-userpassword}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s

volumes:
  mysql_data:
  uploads_data:
